[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gods-eye-mcp"
version = "0.1.0"
description = "MCP server and AgentCash skill for God's Eye Solana token and deployer risk telemetry (x402)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
gods-eye-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
